<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog and News sample template | FCSE Web Development</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/webdev/demo.css">
<style>:root{--c:#b91c1c;--bg:#fff;--hd:#fff;--line:#e5e7eb;--ft:#111827}</style></head>
<body data-name="Blog and News">
<header class="top"><div class="w" style="flex-direction:column;padding:14px 20px"><a class="logo" href="#" style="font-size:2.6rem;color:#111827">THE SIALKOT POST</a><nav id="bn"></nav></div></header>
<section class="sec"><div class="w"><input id="q" placeholder="Search articles" style="max-width:360px;margin-bottom:18px"><div class="grid g3" id="al"></div><p class="note" id="none" hidden>No article matches.</p></div></section>
<section class="sec" style="background:#f3f4f6"><div class="w" style="max-width:520px"><h2>Get new stories by WhatsApp</h2><form id="nf" style="display:flex;gap:8px"><input name="Phone" placeholder="Your phone number" required><button class="btn">Subscribe</button></form></div></section><footer class="f"><div class="w">THE SIALKOT POST. Sample website with made-up names. Built as a template by First Computer Service &amp; Engineering (FCSE).</div></footer>
<script src="/webdev/demo.js"></script>
<script>var C=['Local','Business','Sports','Technology'];var A=[];for(var i=0;i<8;i++)A.push({t:'A headline that tells the story in one line, number '+(i+1),c:C[i%4],d:'A short summary of the article goes here so readers know what it is about.'});
var cur='All';$('#bn').innerHTML=['All'].concat(C).map(function(c){return'<a href="#" data-c="'+c+'">'+c+'</a>'}).join('');
function draw(){var q=$('#q').value.toLowerCase();var r=A.filter(function(a){return(cur==='All'||a.c===cur)&&(a.t+a.d).toLowerCase().indexOf(q)>-1});$('#al').innerHTML=r.map(function(a,i){return'<article class="card"><div class="ph" style="min-height:120px;margin-bottom:10px"></div><b style="color:#b91c1c;font-size:12px;letter-spacing:.08em">'+a.c.toUpperCase()+'</b><h3>'+a.t+'</h3><p>'+a.d+'</p><a href="#" data-r="'+A.indexOf(a)+'" style="font-weight:700">Read more</a></article>'}).join('');$('#none').hidden=r.length>0}
draw();$('#q').addEventListener('input',draw);
$('#bn').addEventListener('click',function(e){var a=e.target.closest('[data-c]');if(!a)return;e.preventDefault();cur=a.dataset.c;draw()});
$('#al').addEventListener('click',function(e){var a=e.target.closest('[data-r]');if(!a)return;e.preventDefault();var x=A[a.dataset.r];modal('<b style="color:#b91c1c">'+x.c+'</b><h2>'+x.t+'</h2><p>'+x.d+'</p><p>The full article text appears here. Readers can share it with the buttons below.</p><p><button class="btn" onclick="wa(\'Sharing: '+x.t.replace(/\'/g,'')+'\')">Share on WhatsApp</button></p>')});
$('#nf').addEventListener('submit',function(e){e.preventDefault();wa('Newsletter signup\n'+fd(this))});</script>
</body></html>
