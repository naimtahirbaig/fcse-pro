<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Store sample template | FCSE Web Development</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/webdev/demo.css">
<style>:root{--c:#7c3aed;--bg:#fff;--hd:#fff;--line:#ece8f0;--ft:#1f1b24}</style></head>
<body data-name="Online Store">
<header class="top"><div class="w"><a class="logo" href="#">BAZAAR</a><input id="q" placeholder="Search products" style="max-width:300px"><button class="btn" id="cb">Cart (<span id="cn">0</span>)</button></div></header>
<section class="sec" style="padding-bottom:10px"><div class="w"><div class="card" style="background:linear-gradient(120deg,#7c3aed,#c084fc);color:#fff;border:0"><h1>New season offers</h1><p>Short banner line for your sale or new arrivals.</p></div></div></section>
<section class="sec" style="padding-top:20px"><div class="w"><div class="chipbar" id="cc"></div><div class="grid g4" id="pl"></div></div></section><footer class="f"><div class="w">BAZAAR. Sample website with made-up names. Built as a template by First Computer Service &amp; Engineering (FCSE).</div></footer>
<div class="modal" id="cart"><div class="box"><button class="x" aria-label="Close">&times;</button><h3>Your cart</h3><div id="ci"></div><p><b>Total: Rs. <span id="ct">0</span></b></p><form id="co"><label>Name</label><input name="Name" required><label>Phone</label><input name="Phone" required><label>Address</label><textarea name="Address" required></textarea><label>Payment</label><select name="Payment"><option>Cash on delivery</option><option>Bank transfer</option><option>Wallet</option></select><p><button class="btn">Place order on WhatsApp</button></p></form></div></div>
<script src="/webdev/demo.js"></script>
<script>var P=[['Wireless mouse','Electronics',1200,'#ddd6fe'],['Keyboard','Electronics',2400,'#c7d2fe'],['Backpack','Bags',3200,'#fde68a'],['Travel bag','Bags',5400,'#fed7aa'],['Water bottle','Home',650,'#bbf7d0'],['Desk lamp','Home',1800,'#a7f3d0'],['Headphones','Electronics',3900,'#fbcfe8'],['Wallet','Bags',900,'#fecdd3']];
var cat='All',cart={};var cats=['All','Electronics','Bags','Home'];$('#cc').innerHTML=cats.map(function(c,i){return'<button class="chp" data-v="'+c+'" aria-pressed="'+(i==0)+'">'+c+'</button>'}).join('');
function draw(){var q=$('#q').value.toLowerCase();$('#pl').innerHTML=P.map(function(p,i){return(cat==='All'||p[1]===cat)&&p[0].toLowerCase().indexOf(q)>-1?'<div class="card" style="padding:0;overflow:hidden"><div style="height:120px;background:'+p[3]+'"></div><div style="padding:12px"><b>'+p[0]+'</b><div style="color:#5b21b6;font-weight:900;margin:4px 0 8px">Rs. '+p[2]+'</div><button class="btn" style="width:100%" data-a="'+i+'">Add to cart</button></div></div>':''}).join('')}
draw();chips($('#cc'),function(v){cat=v;draw()});$('#q').addEventListener('input',draw);
function rc(){var t=0,n=0,h='';for(var k in cart){var p=P[k],q=cart[k];t+=p[2]*q;n+=q;h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:8px 0"><span>'+p[0]+'</span><span><button class="chp" data-m="'+k+'">-</button> '+q+' <button class="chp" data-p="'+k+'">+</button></span><b>Rs. '+p[2]*q+'</b></div>'}$('#ci').innerHTML=h||'<p>Your cart is empty.</p>';$('#ct').textContent=t;$('#cn').textContent=n}
$('#pl').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var k=b.dataset.a;cart[k]=(cart[k]||0)+1;rc();toast(P[k][0]+' added to cart')});
$('#cb').addEventListener('click',function(){$('#cart').classList.add('on')});
$('#cart').addEventListener('click',function(e){var t=e.target;if(t.id==='cart'||t.classList.contains('x'))$('#cart').classList.remove('on');if(t.dataset.p){cart[t.dataset.p]++;rc()}if(t.dataset.m){if(--cart[t.dataset.m]<1)delete cart[t.dataset.m];rc()}});
$('#co').addEventListener('submit',function(e){e.preventDefault();if(!Object.keys(cart).length){toast('Add something to the cart first');return}var l=Object.keys(cart).map(function(k){return P[k][0]+' x'+cart[k]}).join(', ');wa('Store order: '+l+'. Total Rs. '+$('#ct').textContent+'\n'+fd(this))});rc();</script>
</body></html>
