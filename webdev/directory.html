<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Directory and Listings sample template | FCSE Web Development</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/webdev/demo.css">
<style>:root{--c:#166534;--bg:#f6f7f2;--hd:#fff;--line:#e2e6d8;--ft:#14301f}</style></head>
<body data-name="Directory and Listings">
<header class="top"><div class="w"><a class="logo" href="#">PLOT &amp; HOME</a><nav><a href="#list">Listings</a><a href="#sell">List your property</a></nav><a class="btn" href="#list">Search</a></div></header>
<section class="sec" style="background:linear-gradient(120deg,#166534,#4ade80)"><div class="w"><h1 style="color:#fff">Find your next property</h1><div class="card grid g4" style="align-items:end"><div><label>Area</label><select id="fa"><option value="">Any</option></select></div><div><label>Type</label><select id="ft"><option value="">Any</option><option>House</option><option>Plot</option><option>Shop</option></select></div><div><label>Max price (lakh)</label><input id="fp" type="number" placeholder="e.g. 200"></div><button class="btn" id="fs">Search</button></div></div></section>
<section class="sec" id="list"><div class="w"><p id="cnt" class="note"></p><div class="grid g3" id="ls"></div></div></section>
<section class="sec" id="sell" style="background:#fff"><div class="w" style="max-width:560px"><h2>List your property</h2><form id="sf" class="card"><label>Name</label><input name="Name" required><label>Phone</label><input name="Phone" required><label>Property details</label><textarea name="Details"></textarea><p><button class="btn">Send on WhatsApp</button></p></form></div></section><footer class="f"><div class="w">PLOT &amp; HOME. Sample website with made-up names. Built as a template by First Computer Service &amp; Engineering (FCSE).</div></footer>
<script src="/webdev/demo.js"></script>
<script>var A=['Cantt','Model Town','Paris Road','Defence'];var Ty=['House','Plot','Shop'];var L=[];for(var i=0;i<9;i++)L.push({t:Ty[i%3]+' number '+(i+1),a:A[i%4],ty:Ty[i%3],p:60+i*22,s:(5+i%4*3)+' marla'});
$('#fa').innerHTML+=A.map(function(a){return'<option>'+a+'</option>'}).join('');
function draw(){var a=$('#fa').value,t=$('#ft').value,p=+$('#fp').value||1e9;var r=L.filter(function(x){return(!a||x.a===a)&&(!t||x.ty===t)&&x.p<=p});$('#cnt').textContent=r.length+' listings found';$('#ls').innerHTML=r.map(function(x){return'<div class="card" style="padding:0;overflow:hidden"><div class="ph" style="border-radius:0;min-height:110px"></div><div style="padding:12px"><b>'+x.t+'</b><div class="note">'+x.a+' | '+x.s+'</div><b style="color:#166534">Rs. '+x.p+' lakh</b><p><button class="btn" data-q="'+x.t+'" style="width:100%">Enquire</button></p></div></div>'}).join('')}
draw();['fa','ft','fp'].forEach(function(i){$('#'+i).addEventListener('input',draw)});$('#fs').addEventListener('click',draw);
$('#ls').addEventListener('click',function(e){var b=e.target.closest('[data-q]');if(b)wa('Enquiry about listing: '+b.dataset.q)});
$('#sf').addEventListener('submit',function(e){e.preventDefault();wa('New property to list\n'+fd(this))});</script>
</body></html>
