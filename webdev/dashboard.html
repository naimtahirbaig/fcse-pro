<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web App and Dashboard sample template | FCSE Web Development</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/webdev/demo.css">
<style>:root{--c:#2563eb;--bg:#f3f5f9;--hd:#fff;--line:#e5e7eb}</style></head>
<body data-name="Web App and Dashboard">
<div id="login" style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px"><form id="lf" class="card" style="max-width:360px;width:100%"><h2>LEDGER</h2><p class="note">Demo login. Any name works.</p><label>Username</label><input name="u" value="demo" required><label>Password</label><input type="password" value="demo" required><p><button class="btn" style="width:100%">Sign in</button></p></form></div>
<div id="app" hidden><header class="top"><div class="w"><a class="logo" href="#">LEDGER</a><span id="who" class="note"></span><button class="btn alt" id="out">Sign out</button></div></header>
<section class="sec" style="padding-top:24px"><div class="w"><div class="grid g3" id="kp"></div><div class="grid g2" style="margin-top:16px"><div class="card"><b>Monthly overview</b><div id="ch" style="display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:12px"></div></div>
<form class="card" id="nf"><b>New invoice</b><label>Customer</label><input name="c" required><label>Amount (Rs.)</label><input name="a" type="number" min="1" required><p><button class="btn">Add invoice</button></p></form></div>
<div class="card" style="margin-top:16px;overflow:auto"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Invoices</b><input id="sq" placeholder="Search customer" style="max-width:220px"></div><table style="width:100%;border-collapse:collapse;margin-top:10px"><thead><tr style="text-align:left"><th>No.</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></div>
<script src="/webdev/demo.js"></script>
<script>var K='fcse-demo-ledger';var inv;try{inv=JSON.parse(localStorage.getItem(K))}catch(e){}if(!inv)inv=[{c:'Customer A',a:12500,p:1},{c:'Customer B',a:8400,p:0},{c:'Customer C',a:23000,p:1}];
function save(){try{localStorage.setItem(K,JSON.stringify(inv))}catch(e){}}
function draw(){var q=$('#sq').value.toLowerCase(),s=0,pd=0;inv.forEach(function(x){s+=x.a;if(!x.p)pd+=x.a});
$('#kp').innerHTML=[['Sales','Rs. '+s],['Invoices',inv.length],['Pending','Rs. '+pd]].map(function(k){return'<div class="card"><div class="note" style="margin:0">'+k[0]+'</div><div style="font-size:1.8rem;font-weight:900">'+k[1]+'</div></div>'}).join('');
var mx=Math.max.apply(null,inv.map(function(x){return x.a}));$('#ch').innerHTML=inv.slice(-8).map(function(x){return'<div title="'+x.c+'" style="flex:1;height:'+Math.max(8,x.a/mx*100)+'%;background:linear-gradient(180deg,#60a5fa,#2563eb);border-radius:6px 6px 0 0"></div>'}).join('');
$('#tb').innerHTML=inv.map(function(x,i){return x.c.toLowerCase().indexOf(q)>-1?'<tr style="border-top:1px solid #eef0f4"><td>#'+(1001+i)+'</td><td>'+x.c.replace(/</g,'&lt;')+'</td><td>Rs. '+x.a+'</td><td><button class="chp" data-t="'+i+'">'+(x.p?'Paid':'Pending')+'</button></td></tr>':''}).join('')}
function show(on){$('#login').hidden=on;$('#app').hidden=!on;if(on)draw()}
$('#lf').addEventListener('submit',function(e){e.preventDefault();$('#who').textContent='Signed in as '+this.u.value;show(true)});
$('#out').addEventListener('click',function(){show(false)});
$('#nf').addEventListener('submit',function(e){e.preventDefault();inv.push({c:this.c.value,a:+this.a.value,p:0});save();this.reset();draw()});
$('#tb').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(b){inv[b.dataset.t].p^=1;save();draw()}});
$('#sq').addEventListener('input',draw);</script>
</body></html>
