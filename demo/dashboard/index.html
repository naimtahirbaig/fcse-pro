<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | Web App and Dashboard sample template</title><meta name="robots" content="noindex"><link rel="icon" href="/favicon.ico">
<link rel="preload" href="/demo/assets/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/demo/assets/demo.css"><style>:root{--bg:#f4f6fb;--surface:#f4f6fb;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--p:#4f46e5;--p2:#22d3ee;--pf:#fff;--grad:linear-gradient(135deg,#4f46e5,#6366f1);--rad:14px;--ft:#0f172a;--sh:0 10px 30px rgba(15,23,42,.08)}html.dk{--bg:#0b1020;--surface:#0b1020;--card:#131a33;--ink:#e8ecff;--muted:#97a0c4;--line:#232c52}html.dk body{background:#0b1020}</style></head>
<body data-key="index"><main><div style="min-height:calc(100vh - 46px);display:grid;grid-template-columns:1fr 1fr" class="lg"><div style="background:linear-gradient(135deg,#312e81,#4f46e5 55%,#22d3ee);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center"><div class="logo" style="color:#fff;margin-bottom:30px">Ledger<span style="color:#a5b4fc">ly</span></div><h1 style="font-size:clamp(2rem,4vw,3rem)">Run your business from one screen</h1><p style="opacity:.85;max-width:44ch">Invoices, customers and stock in one calm dashboard. This is a working sample: sign in with any name.</p></div><div style="display:grid;place-items:center;padding:30px"><form id="lf" class="card" style="max-width:380px;width:100%;box-shadow:var(--sh)"><h2 style="font-size:1.8rem">Welcome back</h2><p class="muted">Sample login. Any details work.</p><label>Username</label><input name="u" value="demo" required><label>Password</label><input type="password" value="demo" required><p style="margin-top:18px"><button class="btn full">Sign in</button></p></form></div></div><style>@media(max-width:800px){.lg{grid-template-columns:1fr!important}}</style></main><script>window.DEMO={"slug":"dashboard","name":"Web App and Dashboard","pages":[["/demo/dashboard/","Sign in"],["/demo/dashboard/overview","Overview"],["/demo/dashboard/customers","Customers"],["/demo/dashboard/invoices","Invoices"],["/demo/dashboard/inventory","Inventory"],["/demo/dashboard/reports","Reports"],["/demo/dashboard/settings","Settings"]],"cur":0};</script><script src="/demo/assets/demo.js"></script><script>/*defer*/
var DK="ledgerly-data";
function seed(){return{customers:[["Alpha Traders","Sialkot","0300 1111111",125000],["Bright Foods","Daska","0300 2222222",84000],["City Pharmacy","Sialkot","0300 3333333",210500],["Delta Sports","Wazirabad","0300 4444444",56000],["Evergreen Mart","Sialkot","0300 5555555",98000],["Fine Fabrics","Gujranwala","0300 6666666",143000]],invoices:[[1001,"Alpha Traders",32000,"Paid","2025-01-04"],[1002,"Bright Foods",18500,"Pending","2025-01-09"],[1003,"City Pharmacy",54000,"Paid","2025-01-12"],[1004,"Delta Sports",12000,"Overdue","2025-01-15"],[1005,"Evergreen Mart",27500,"Paid","2025-01-21"],[1006,"Fine Fabrics",41000,"Pending","2025-01-26"]],inventory:[["Printer paper A4",120,40],["Ink cartridge",18,20],["USB cable",64,30],["Keyboard",9,10],["Wireless mouse",35,15],["Router",6,8]],monthly:[42,55,48,63,71,66,82,90,76,95,101,118]}}
function db(){var d=store(DK,null);if(!d){d=seed();save(DK,d)}return d}
function sd(d){save(DK,d)}
function auth(){try{return sessionStorage.getItem("ledgerly-auth")}catch(e){return 1}}
if(DEMO.cur!==0&&!auth()){location.replace("/demo/dashboard/")}
$$("[data-logout]").forEach(function(a){a.addEventListener("click",function(){try{sessionStorage.removeItem("ledgerly-auth")}catch(e){}})});
var th=store("ledgerly-theme","light");if(th==="dark")document.documentElement.classList.add("dk");
function money(n){return"Rs. "+Number(n).toLocaleString()}
function pill(s){return'<span class="pill '+(s==="Paid"?"ok":s==="Pending"?"warn":"bad")+'">'+s+'</span>'}
function line(vals,w,h,col){var mx=Math.max.apply(null,vals)*1.1,p=vals.map(function(v,i){return[20+i*(w-40)/(vals.length-1),h-20-v/mx*(h-40)]});var d=p.map(function(a,i){return(i?"L":"M")+a[0].toFixed(1)+" "+a[1].toFixed(1)}).join(" ");return'<svg viewBox="0 0 '+w+' '+h+'" style="width:100%"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".3"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs><path d="'+d+' L'+p[p.length-1][0]+' '+(h-20)+' L20 '+(h-20)+'Z" fill="url(#lg)"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linejoin="round"/>'+p.map(function(a){return'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="3.5" fill="'+col+'"/>'}).join("")+'</svg>'}
function bars(vals,labs,w,h,col){var mx=Math.max.apply(null,vals)*1.1,bw=(w-40)/vals.length;return'<svg viewBox="0 0 '+w+' '+h+'" style="width:100%">'+vals.map(function(v,i){var bh=v/mx*(h-50);return'<rect x="'+(20+i*bw+6)+'" y="'+(h-30-bh)+'" width="'+(bw-12)+'" height="'+bh+'" rx="6" fill="'+col+'" opacity="'+(.45+.55*v/mx)+'"/><text x="'+(20+i*bw+bw/2)+'" y="'+(h-10)+'" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">'+labs[i]+'</text>'}).join("")+'</svg>'}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
;$("#lf").addEventListener("submit",function(e){e.preventDefault();try{sessionStorage.setItem("ledgerly-auth","1")}catch(x){}location.href="/demo/dashboard/overview"})</script></body></html>
