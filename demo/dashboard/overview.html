<body data-key="overview"><div class="side"><aside><a class="logo" href="/demo/dashboard/overview" style="color:#fff;margin:0 0 20px;padding:0 6px"><span>Ledger<span style="color:#818cf8">ly</span></span><i style="background:linear-gradient(135deg,#6366f1,#22d3ee)"></i></a><a href="/demo/dashboard/overview" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Overview</a><a href="/demo/dashboard/customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7M2 20a7 7 0 0114 0M17 5a3 3 0 010 6M18 20a6 6 0 00-3-5"/></svg>Customers</a><a href="/demo/dashboard/invoices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h5"/></svg>Invoices</a><a href="/demo/dashboard/inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></svg>Inventory</a><a href="/demo/dashboard/reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-8"/></svg>Reports</a><a href="/demo/dashboard/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 100-6 3 3 0 000 6M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 00-2-1.2L14 3h-4l-.6 2.7a7 7 0 00-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 000 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 002 1.2L10 21h4l.6-2.7a7 7 0 002-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2"/></svg>Settings</a><a href="/demo/dashboard/" data-logout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v9H6zM8 11V8a4 4 0 018 0v3"/></svg>Sign out</a></aside><main><h1 style="font-size:1.8rem">Overview</h1><p class="muted">A quick look at how the business is doing.</p><div class="kpi" id="kpi"></div><div class="grid" style="grid-template-columns:2fr 1fr;gap:18px" id="ow"><div class="card"><b>Sales this year (Rs. thousand)</b><div id="ch"></div></div><div class="card"><b>Low stock</b><div id="ls" style="margin-top:10px"></div></div></div><div class="card" style="margin-top:18px"><b>Recent invoices</b><div id="ri" style="margin-top:8px"></div></div><style>@media(max-width:900px){#ow{grid-template-columns:1fr!important}}</style></main></div><script>window.DEMO={"slug":"dashboard","name":"Web App and Dashboard","pages":[["/demo/dashboard/","Sign in"],["/demo/dashboard/overview","Overview"],["/demo/dashboard/customers","Customers"],["/demo/dashboard/invoices","Invoices"],["/demo/dashboard/inventory","Inventory"],["/demo/dashboard/reports","Reports"],["/demo/dashboard/settings","Settings"]],"cur":1};</script><script src="/demo/assets/demo.js"></script><script>/*defer*/
var DK="ledgerly-data";
function seed(){return{customers:[["Alpha Traders","Sialkot","0300 1111111",125000],["Bright Foods","Daska","0300 2222222",84000],["City Pharmacy","Sialkot","0300 3333333",210500],["Delta Sports","Wazirabad","0300 4444444",56000],["Evergreen Mart","Sialkot","0300 5555555",98000],["Fine Fabrics","Gujranwala","0300 6666666",143000]],invoices:[[1001,"Alpha Traders",32000,"Paid","2025-01-04"],[1002,"Bright Foods",18500,"Pending","2025-01-09"],[1003,"City Pharmacy",54000,"Paid","2025-01-12"],[1004,"Delta Sports",12000,"Overdue","2025-01-15"],[1005,"Evergreen Mart",27500,"Paid","2025-01-21"],[1006,"Fine Fabrics",41000,"Pending","2025-01-26"]],inventory:[["Printer paper A4",120,40],["Ink cartridge",18,20],["USB cable",64,30],["Keyboard",9,10],["Wireless mouse",35,15],["Router",6,8]],monthly:[42,55,48,63,71,66,82,90,76,95,101,118]}}
function db(){var d=store(DK,null);if(!d){d=seed();save(DK,d)}return d}
function sd(d){save(DK,d)}
function auth(){try{return sessionStorage.getItem("ledgerly-auth")}catch(e){return 1}}
if(DEMO.cur!==0&&!auth()){location.replace("/demo/dashboard/")}
$$("[data-logout]").forEach(function(a){a.addEventListener("click",function(){try{sessionStorage.removeItem("ledgerly-auth")}catch(e){}})});
var th=store("ledgerly-theme","light");if(th==="dark")document.documentElement.classList.add("dk");
function money(n){return"Rs. "+Number(n).toLocaleString()}
function pill(s){return'<span class="pill '+(s==="Paid"?"ok":s==="Pending"?"warn":"bad")+'">'+s+'</span>'}
function line(vals,w,h,col){var mx=Math.max.apply(null,vals)*1.1,p=vals.map(function(v,i){return[20+i*(w-40)/(vals.length-1),h-20-v/mx*(h-40)]});var d=p.map(function(a,i){return(i?"L":"M")+a[0].toFixed(1)+" "+a[1].toFixed(1)}).join(" ");return'<svg viewBox="0 0 '+w+' '+h+'" style="width:100%"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".3"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs><path d="'+d+' L'+p[p.length-1][0]+' '+(h-20)+' L20 '+(h-20)+'Z" fill="url(#lg)"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linejoin="round"/>'+p.map(function(a){return'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="3.5" fill="'+col+'"/>'}).join("")+'</svg>'}
function bars(vals,labs,w,h,col){var mx=Math.max.apply(null,vals)*1.1,bw=(w-40)/vals.length;return'<svg viewBox="0 0 '+w+' '+h+'" style="width:100%">'+vals.map(function(v,i){var bh=v/mx*(h-50);return'<rect x="'+(20+i*bw+6)+'" y="'+(h-30-bh)+'" width="'+(bw-12)+'" height="'+bh+'" rx="6" fill="'+col+'" opacity="'+(.45+.55*v/mx)+'"/><text x="'+(20+i*bw+bw/2)+'" y="'+(h-10)+'" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">'+labs[i]+'</text>'}).join("")+'</svg>'}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
;var d=db(),paid=0,pend=0;d.invoices.forEach(function(i){if(i[3]==="Paid")paid+=i[2];else pend+=i[2]});
$("#kpi").innerHTML=[["Revenue",money(paid)],["Pending",money(pend)],["Customers",d.customers.length],["Invoices",d.invoices.length]].map(function(k){return'<div class="card"><span>'+k[0]+'</span><b>'+k[1]+'</b></div>'}).join("");
$("#ch").innerHTML=line(d.monthly,600,240,"#4f46e5");
$("#ls").innerHTML=d.inventory.filter(function(i){return i[1]<=i[2]}).map(function(i){return'<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>'+i[0]+'</span><b style="color:#dc2626">'+i[1]+' left</b></div>'}).join("")||'<p class="muted">All stock levels are healthy.</p>';
$("#ri").innerHTML='<table class="tbl"><tbody>'+d.invoices.slice(-4).reverse().map(function(i){return"<tr><td>#"+i[0]+"</td><td>"+esc(i[1])+"</td><td>"+money(i[2])+"</td><td>"+pill(i[3])+"</td></tr>"}).join("")+"</tbody></table>"</script></body></html>
